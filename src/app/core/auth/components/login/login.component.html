<p-toast></p-toast>
        
        <div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
            
            <div class="flex flex-column align-items-center justify-content-center">
                
                <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
                    
                    <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius: 53px">
                        
                    <div class="text-center mb-5">
                        <div class="mb-5">
                            <!-- Reemplazo del SVG por la imagen estática del logo -->
                            <img src="/assets/layout/images/logo.svg" alt="TOGAMMA Logo" class="h-5rem w-auto mx-auto" />                        </div>
                        <div class="text-900 text-3xl font-medium mb-3">Bienvenido</div>
                        <span class="text-600 font-medium">Inicia sesión para continuar</span>
                    </div>

                        <div>
                            <label for="username" class="block text-900 text-xl font-medium mb-2">Usuario</label>
                            <input pInputText id="username" type="text" placeholder="Username" class="w-full mb-5" [(ngModel)]="username" />

                            <label for="password" class="block text-900 font-medium text-xl mb-2">Contraseña</label>
                            <p-password id="password" [(ngModel)]="password" placeholder="Password" [toggleMask]="true" styleClass="w-full mb-5" [inputStyleClass]="'w-full'" [feedback]="false"></p-password>

                            <div class="flex align-items-center justify-content-between mt-2 mb-5 gap-5">
                                <div class="flex align-items-center">
                                    <p-checkbox [(ngModel)]="checked" id="rememberme" binary class="mr-2"></p-checkbox>
                                    <label for="rememberme" class="text-900">Recordarme</label>
                                </div>
                                <a class="font-medium no-underline ml-2 text-right cursor-pointer text-primary">¿Olvidaste tu contraseña?</a>
                            </div>
                            <p-button label="Ingresar" styleClass="w-full" (click)="onLogin()" [loading]="isLoading"></p-button>

                            <div class="flex align-items-center my-4">
                                <hr class="w-full border-top-1 border-300 m-0" />
                                <span class="px-3 text-500 font-medium text-sm">O</span>
                                <hr class="w-full border-top-1 border-300 m-0" />
                            </div>

                            <p-button 
                                label="Continuar con Google" 
                                icon="pi pi-google" 
                                styleClass="w-full p-button-outlined" 
                                (click)="onGoogleLogin()" 
                                [disabled]="isLoading">
                            </p-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
